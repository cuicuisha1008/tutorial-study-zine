<svg xmlns="http://www.w3.org/2000/svg" width="1086" height="1448" viewBox="0 0 1086 1448">
  <title>AI 干中学系列空白母版</title>
  <desc>固定背景、页眉、页脚和品牌装饰；正文内容区保持空白。</desc>
  <defs>
    <pattern id="dotGrid" width="54" height="54" patternUnits="userSpaceOnUse">
      <circle cx="27" cy="27" r="1.65" fill="#BFD4DC" opacity="0.62"/>
    </pattern>
    <pattern id="tapeDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#E8A092"/>
      <circle cx="4" cy="5" r="2.2" fill="#F9E8DD" opacity="0.9"/>
      <circle cx="14" cy="13" r="2" fill="#F9E8DD" opacity="0.78"/>
      <path d="M0 17L17 0M7 18L18 7" stroke="#D98376" stroke-width="0.8" opacity="0.38"/>
    </pattern>
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="softNoise">
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>
    <filter id="tapeShadow" x="-30%" y="-50%" width="160%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7B5144" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- LOCKED: paper, grid and edge warmth -->
  <rect width="1086" height="1448" fill="#F6F0E8"/>
  <rect width="1086" height="1448" fill="url(#dotGrid)"/>
  <rect width="1086" height="1448" fill="#F6F0E8" opacity="0.22" filter="url(#paperNoise)"/>
  <rect x="1" y="1" width="1084" height="1446" fill="none" stroke="#E9DED1" stroke-width="2" opacity="0.58"/>

  <!-- LOCKED: header -->
  <text x="60" y="72" fill="#C86545" font-family="Songti SC, STSong, Source Han Serif SC, serif" font-size="22" font-weight="400" letter-spacing="4.1">{{SERIES_LABEL}}  ——  {{ISSUE_TITLE}}</text>
  <g transform="translate(974 48) rotate(-8)" fill="none" stroke="#D49531" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 0l5 14 15 1-12 9 4 15-12-9-13 8 5-14L0 15l14-1z"/>
    <path d="M18 0l0 30M5 38l21-14M0 15l30 15" opacity=".7"/>
  </g>
  <line x1="64" y1="108" x2="1022" y2="108" stroke="#C86545" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.92"/>

  <!-- LOCKED: restrained corner ornaments -->
  <g transform="translate(932 121) rotate(-7)" fill="none" stroke="#D94F70" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.96">
    <path d="M31 22C9 1-9 13 4 31c9 12 27 4 34-2"/>
    <path d="M38 29c9-18 29-23 40-10 10 12-2 27-16 23-9-3-15-8-24-13z"/>
    <path d="M35 25c7 0 10 5 7 11-4 7-13 5-14-1-1-5 2-9 7-10z"/>
    <path d="M33 37c-3 18-11 31-14 47M40 38c9 14 13 29 14 46"/>
  </g>

  <!-- LOCKED: one tape sample; may be covered by a content-layer paper card -->
  <g transform="translate(76 145) rotate(-10 72 28)" filter="url(#tapeShadow)">
    <path d="M0 9L13 2 24 7 36 1 49 7 62 2 75 8 89 2 103 7 116 1 130 8 144 4v48l-13-5-13 6-13-6-13 5-13-6-13 6-13-5-13 6-13-6-13 5-14-6z" fill="url(#tapeDots)" opacity="0.94"/>
  </g>

  <!-- CONTENT LAYER: intentionally blank x=64..1022, y=128..1338 -->

  <!-- LOCKED: footer -->
  <line x1="64" y1="1362" x2="874" y2="1362" stroke="#C86545" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.92"/>
  <text x="884" y="1386" fill="#C86545" font-family="Georgia, Times New Roman, serif" font-size="26" letter-spacing="1.4">PAGE {{PAGE_NUMBER}}</text>
  <g transform="translate(1026 1359) scale(.72)" fill="none" stroke="#C86545" stroke-width="2.1" stroke-linecap="round" opacity="0.95">
    <path d="M4 48c14-17 21-34 23-50"/>
    <path d="M18 24c-9 0-15-4-17-11 9-1 15 3 17 11zM23 13c7-5 13-5 18-1-5 7-11 8-18 1zM11 36c-7 1-12-1-16-6 7-3 13-1 16 6z"/>
  </g>
</svg>
